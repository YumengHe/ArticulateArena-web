<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Articulate Arena Documentation</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="./docs/index.html">
  <script>
    // The documentation moved to one page per section under docs/. Old
    // single-page anchors (#installation, #concept-twist, ...) map to pages.
    (function () {
      var hash = location.hash.replace('#', '');
      var pages = {
        overview: 'index', installation: 'installation', quickstart: 'quickstart',
        concepts: 'concepts', 'concept-notation': 'concepts', api: 'api', cli: 'cli'
      };
      var target = pages[hash] || (hash.indexOf('concept-') === 0 ? hash : 'index');
      location.replace('./docs/' + target + '.html');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./docs/index.html">
</head>
<body>
  <p>The documentation moved to <a href="./docs/index.html">docs/</a>.</p>
</body>
</html>
